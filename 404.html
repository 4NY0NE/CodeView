<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1016">
<title>Página não encontrada · CodeView</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--ink:#0e1016;--panel:#151821;--line:#292e3c;--text:#e9ebf1;--muted:#8a90a2;--accent:#4fd1c5;--accent-ink:#04211e;--live:#ff4757;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:16px/1.5 "Figtree","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));-webkit-font-smoothing:antialiased}
main{max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.tv{width:150px;aspect-ratio:16/10;border:3px solid var(--accent);border-radius:14px;display:grid;place-items:center;position:relative;color:var(--accent);font:800 44px "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.04em}
.tv::after{content:"";position:absolute;top:-9px;right:-9px;width:18px;height:18px;border-radius:50%;background:var(--live);box-shadow:0 0 0 5px var(--ink),0 0 18px var(--live)}
h1{font:800 clamp(28px,6vw,38px)/1.05 "Bricolage Grotesque","Segoe UI",sans-serif;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
p{color:var(--muted);margin:0}
a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;border-radius:10px;padding:12px 20px;margin-top:6px}
a.btn:hover{filter:brightness(1.08)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
small{color:#5d6375}
</style>
</head>
<body>
<main>
  <div class="tv" aria-hidden="true">404</div>
  <h1>Essa tela está fora do ar</h1>
  <p>O endereço que você abriu não existe. Se era um convite, peça para o anfitrião mandar o link da sala de novo.</p>
  <a class="btn" href="/">Voltar ao CodeView</a>
  <small>Links de convite terminam em /sala/ e o código da sala</small>
</main>
</body>
</html>
