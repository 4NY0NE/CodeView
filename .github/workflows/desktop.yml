name: Build do CodeView Desktop

# Gera o instalador do Windows e publica em Releases (o site lê o "latest" para mostrar o botão de download).
# Roda sozinho quando algo em desktop/ muda no master (ou em Actions > "Build do CodeView Desktop" > Run workflow). Subir a versão em desktop/package.json cria uma release nova.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: CodeView-Setup
          path: desktop/dist/*.exe
      - name: Versão
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
        shell: bash
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.v.outputs.version }}
          name: CodeView para Windows ${{ steps.v.outputs.version }}
          body: |
            Instalador do CodeView para Windows (escolha de janela e de som por aplicativo).
            Sem assinatura digital: se o Windows avisar "editor desconhecido", clique em Mais informações e depois em Executar assim mesmo.
          files: desktop/dist/CodeView-Setup.exe
          make_latest: true
