# Links de convite bonitos: /sala/K7M2QX abre o app já com o código preenchido.
[[redirects]]
  from = "/sala/*"
  to = "/index.html"
  status = 200

# Atalho curto para digitar no celular: /s/K7M2QX
[[redirects]]
  from = "/s/:code"
  to = "/sala/:code"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/sala"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "display-capture=(self), camera=(self), microphone=(self), fullscreen=(self), picture-in-picture=(self), geolocation=()"

# O HTML nunca fica em cache, assim cada git push aparece na hora.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sala/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Arquivo que o site consulta para avisar quando sai uma versão nova. Nunca fica em cache.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# Função que entrega os servidores TURN (veja netlify/functions/ice.mjs)
[functions]
  directory = "netlify/functions"

# O service worker nunca fica em cache, senão as atualizações não chegam.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
